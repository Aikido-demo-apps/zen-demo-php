# fly.toml app configuration file generated for zen-demo-php on 2025-04-07T10:59:40+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'zen-frankenphp-worker-danger'
primary_region = 'ams'
console_command = 'frankenphp php-cli /var/www/html/artisan tinker'

[build]
  dockerfile = "Dockerfile.frankenphp"
  build-target = "worker"
  [build.args]
    PHP_VERSION = '8.2'

[env]
  APP_ENV = 'production'
  LOG_CHANNEL = 'stderr'
  LOG_LEVEL = 'info'
  LOG_STDERR_FORMATTER = 'Monolog\Formatter\JsonFormatter'
  SESSION_DRIVER = 'cookie'
  SESSION_SECURE_COOKIE = 'true'
  DB_CONNECTION = "pgsql"
  AIKIDO_DISABLE = 'true'

[[vm]]
  memory = '2048mb'
  cpu_kind = 'performance'
  cpus = 1
